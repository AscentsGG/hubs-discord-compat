# Publishes the package to npm when a version tag (v*) is pushed, or when run by
# hand from main. It type checks, tests and builds first, then publishes with npm
# provenance, so the npm page shows where and how the package was built. It uses
# npm trusted publishing (GitHub's OIDC token), so there is no npm token or
# secret. A tag must match the version in package.json. Actions are pinned to
# full commit hashes.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.10.0"
          registry-url: "https://registry.npmjs.org"
      - name: Check the version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "Tag $REF_NAME does not match package.json version $version."
              exit 1
            fi
          elif [ "$REF_NAME" != "main" ]; then
            echo "Run this from main or from a version tag."
            exit 1
          fi
      - name: Check npm (trusted publishing needs 11.5.1 or newer)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
